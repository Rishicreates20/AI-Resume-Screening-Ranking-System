# Resume screener configuration.
# Business logic reads everything tunable from here: model, thresholds, weights, term lists.
# Secrets never live here; they come from environment variables (see .env.example).
#
# Term matching rules (see src/screener/matching.py):
#   - Matching is word-bounded: "ai" never matches inside "maintain".
#   - Plain terms are case-insensitive, EXCEPT short ALL-CAPS terms ("RAG", "LLM"),
#     which are case-sensitive so "rag" or "LL.M." (law degree) do not match.
#   - Spaces, hyphens and dots inside a term are flexible: "tool calling" also
#     matches "tool-calling"; "next.js" also matches "nextjs".
#   - A trailing "s" is optional: "embedding" matches "embeddings".
#   - Prefix "re:" for a raw (case-insensitive) regular expression.

llm:
  enabled: true
  # Any OpenAI-compatible chat-completions endpoint works (Groq, OpenAI, OpenRouter,
  # Gemini's OpenAI-compatible endpoint). Swap provider = change these 3 lines.
  base_url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  temperature: 0
  # "json_schema" sends the Pydantic schema to the API. If the model rejects it,
  # the adapter downgrades to "json_object" for the rest of the run automatically.
  structured_output_mode: json_schema
  # Extra provider-specific request fields. Dropped automatically if the API rejects them.
  extra_params:
    reasoning_effort: low
  max_output_tokens: 3000
  timeout_seconds: 90
  max_retries: 6            # retries on 429 / 5xx / invalid JSON (free tiers throttle often)
  max_retry_wait_seconds: 60
  max_concurrency: 2        # free tiers limit tokens per minute; keep this small
  max_resume_chars: 12000   # longer resumes drop education/certification sections first, then truncate
  cache_dir: .cache/llm

github:
  enabled: true
  api_url: https://api.github.com
  token_env: GITHUB_TOKEN   # optional; raises the limit from 60 to 5000 requests/hour
  timeout_seconds: 10
  max_concurrency: 4
  cache_dir: .cache/github
  cache_ttl_hours: 24
  # 0-5 points: most recent public activity (latest push or public event)
  activity_points:          # days since last activity -> points (first match wins)
    - {within_days: 30, points: 5}
    - {within_days: 90, points: 3}
    - {within_days: 180, points: 1}
  # 0-5 points: one point per maintained (pushed within N days), non-fork repo
  # that is Python or AI-related (language, name, description or topics).
  maintained_within_days: 365
  max_repo_points: 5
  ai_repo_terms: [llm, rag, agent, agents, agentic, langchain, langgraph, llamaindex, gpt,
                  openai, gemini, chatbot, embedding, embeddings, vector, retrieval,
                  ml, ai, nlp, transformer, transformers, genai, mcp, multi-agent]

eligibility:
  # Text found ONLY in these sections never counts as Python/AI evidence
  # (an "AI & ML" degree specialisation or a Coursera certificate is not a project).
  excluded_sections: [education, certifications, interests]
  python_terms: [python, python3]
  # Libraries that only exist in Python: using them is Python evidence.
  python_implied_terms: [fastapi, django, flask, pandas, numpy, pytorch, scikit-learn, sklearn,
                         pydantic, streamlit, sqlalchemy, celery, pytest, matplotlib, scipy,
                         jupyter, keras, tensorflow, asyncio, aiohttp, "hugging face transformers"]
  # LLM / RAG / agentic evidence (the core requirement).
  ai_agentic_terms:
    - langchain
    - langgraph
    - langsmith
    - google adk
    - agent development kit
    - llamaindex
    - llama index
    - crewai
    - autogen
    - semantic kernel
    - haystack
    - dspy
    - smolagents
    - openai agents sdk
    - RAG
    - retrieval augmented generation
    - retrieval-augmented generation
    - embedding
    - vector search
    - vector database
    - vector db
    - vector store
    - semantic search
    - semantic chunking
    - faiss
    - chromadb
    - chroma db
    - pinecone
    - weaviate
    - qdrant
    - milvus
    - pgvector
    - tool calling
    - function calling
    - tool use
    - multi agent
    - multi-agent
    - agentic
    - ai agent
    - llm agent
    - autonomous agent
    - LLM
    - large language model
    - openai
    - gpt-3.5
    - gpt-4
    - gpt-4o
    - gpt-5
    - gemini api
    - google gemini
    - "re:gemini[\\s-]*(?:pro|flash|\\d)"
    - anthropic
    - claude api
    - hugging face
    - huggingface
    - ollama
    - llama 2
    - llama 3
    - mistral
    - groq
    - prompt engineering
    - generative ai
    - genai
    - gen ai
    - model context protocol
    - MCP
    - vertex ai
    - amazon bedrock
    - ragas
    - reranker
    - reranking
    - fine-tuned llm
    - "re:(?-i:Q?LoRA)"
  # Classical ML / DL evidence. Passes the gate (it IS AI) but caps AI depth score.
  classical_ml_terms: [machine learning, deep learning, neural network, tensorflow, pytorch, keras,
                       scikit-learn, sklearn, xgboost, lightgbm, CNN, RNN, LSTM, NLP,
                       natural language processing, computer vision, opencv, yolo, BERT,
                       random forest, logistic regression, transformer model, vision transformer, chatbot, image classification,
                       object detection, sentiment analysis, rasa, dialogflow]
  # If false, candidates with only classical-ML evidence are rejected at the gate.
  allow_classical_ml_only: true
  # Classical ML must appear in a project or job (not just a skills line such as "Machine Learning
  # Basics") to pass the gate. LLM/RAG/agent terms are specific enough to count anywhere.
  classical_ml_requires_applied_evidence: true

# Canonical skill names reported in "matched_skills". Aliases follow the term rules above.
