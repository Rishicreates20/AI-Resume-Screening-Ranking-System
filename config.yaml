scoring:
  # Points for a skill seen only in a skills list, as a fraction of full points.
  listed_only_multiplier: 0.5

  ai_project_depth:
    max: 40
    # Signals are judged per project (by the LLM, or by keyword rules as fallback).
    # A project's score = sum of its verified signals. The candidate gets their best
    # project's score plus a small bonus for a second substantial AI project.
    signals:
      retrieval: 8        # RAG, embeddings, vector search
      tool_calling: 7     # tools / function calling
      orchestration: 7    # multi-step or multi-agent workflow, routing, planning
      evaluation: 6       # measured output quality, eval sets, metrics
      state_memory: 5     # memory, conversation state, checkpoints
      business_logic: 5   # real data processing / backend / product logic around the model
      shipped: 2          # deployed, real users, measured impact
    second_project_bonus_max: 5
    second_project_bonus_fraction: 0.25
    classical_ml_project_cap: 15      # CNN/sklearn projects are AI, but not agentic systems
    skills_only_points: 3             # AI framework listed in skills with no project using it

  python_backend:
    max: 30
    items:
      - {name: Python, points: 6, terms: [python, python3], implied_by_eligibility_libs: true}
      - {name: FastAPI, points: 6, terms: [fastapi], partial_points: 4, partial_terms: [flask, django, django rest framework]}
      - {name: Async programming, points: 6, terms: [asyncio, async, aiohttp, async/await, asynchronous]}
      - {name: PostgreSQL, points: 6, terms: [postgresql, postgres, pgvector, supabase], partial_points: 3, partial_terms: [mysql, sqlite, mongodb, sql, dynamodb, firestore]}
      - {name: Redis, points: 6, terms: [redis], partial_points: 3, partial_terms: [memcached]}

  cloud_fullstack:
    max: 15
    items:
      - {name: GCP, points: 5, terms: [gcp, google cloud, cloud run, bigquery, gke, vertex ai, cloud functions], partial_points: 3, partial_terms: [aws, azure, ec2, aws lambda, s3, firebase]}
      - {name: Docker, points: 4, terms: [docker, dockerfile, docker compose, dockerized, containerized]}
      - {name: Deployment, points: 4, terms: [deployed, deployment, deploy, ci/cd, github actions, kubernetes, k8s, heroku, vercel, render.com, railway, netlify, nginx, production, hosted]}
    # React/Next.js only count when used in the same project as a backend.
    fullstack_points: 2
    frontend_terms: [react, react.js, next.js, nextjs]
    backend_terms: [fastapi, flask, django, node.js, nodejs, express, spring boot, backend, rest api, api endpoint, graphql, postgresql, mongodb]

  engineering_depth:
    max: 5
    # One point per category evidenced in projects/experience (not skills lists).
    items:
      testing: [pytest, unittest, unit test, unit testing, integration test, test coverage, tdd, test suite]
      caching: [cache, caching, cached, memoization, lru cache]
      queues: [queue, celery, rabbitmq, kafka, sqs, pub/sub, background job, background worker, task queue]
      observability: [logging, monitoring, prometheus, grafana, opentelemetry, tracing, sentry, observability, langsmith]
      concurrency: [concurrency, concurrent, multithreading, multi-threaded, multiprocessing, asyncio, thread pool, parallel processing]
      failure_handling: [retry, retries, backoff, fault tolerant, fault tolerance, error handling, circuit breaker, idempotent, rate limiting, fallback, graceful degradation]
      architecture: [microservice, microservices, system design, event-driven, clean architecture, layered architecture, modular architecture, scalable architecture, design pattern]

  # Without at least one LLM/agentic project showing a real depth signal (retrieval, tools,
  # orchestration, state or evaluation), the total is capped so strong generalists cannot
  # outrank AI builders (brief section 4). Set to null to disable.
  no_meaningful_ai_total_cap: 30

  penalties:
    max_total: 15
    all_ai_projects_thin_wrapper: 10   # every LLM project is a thin API wrapper
    some_ai_projects_thin_wrapper: 5   # at least one is, but not all
    tutorial_style_per_project: 2      # listed without implementation details / ownership
    tutorial_style_max: 5

  # Keyword lists the rules fallback uses to detect project signals when the LLM is
  # unavailable. Deliberately simple; the LLM is the primary judge of project depth.
  rules_fallback_signals:
    retrieval: [RAG, retrieval, retriever, embedding, vector search, vector database, vector db, vector store,
                semantic search, faiss, chromadb, chroma, pinecone, qdrant, weaviate, milvus, pgvector,
                llamaindex, knowledge base, reranker, reranking]
    tool_calling: [tool calling, function calling, tool use, tool-using, custom tools, external tools,
                   tool integration, MCP, model context protocol, web search tool]
    orchestration: [langgraph, multi agent, multi-agent, multiple agents, agentic workflow, orchestration,
                    orchestrator, orchestrated, crewai, autogen, google adk, agent development kit, planner,
                    router, supervisor agent, react agent, state machine, workflow graph]
    evaluation: [evaluation, evaluated, eval, ragas, deepeval, benchmark, benchmarked, accuracy, precision,
                 recall, f1, f1-score, bleu, rouge, hallucination, langsmith, a/b test, test set, metrics]
    state_memory: [memory, conversation history, chat history, stateful, state management, session state,
                   checkpoint, checkpointing, long-term memory, persistent state, context management]
    business_logic: [database, postgresql, postgres, mongodb, mysql, redis, fastapi, flask, django, rest api,
                     backend, data pipeline, etl, ingestion, ingest, parsing, preprocessing, scraping,
                     automation, dashboard, crm, authentication, payment, scheduling, analytics, sql]
    shipped: [deployed, production, hosted, cloud run, vercel, heroku, "re:\\d+(?:\\.\\d+)?\\s*%",
              "re:\\d+[kKmM]?\\+?\\s+(?:active\\s+)?(?:users|customers|requests|documents|docs|queries)"]
  tutorial_terms: [tutorial, guided project, course project, followed along, coursera project, udemy]
  tutorial_max_detail_chars: 80   # an entry with less detail than this is "listed without details"

output:
  top_n_console: 15
